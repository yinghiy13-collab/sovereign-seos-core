<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEOS Dashboard — Live Evidence</title>
<style>
  :root { --bg:#05080f; --panel:#0d1522; --bd:#1a2740; --tx:#cbd5e1; --ac:#38bdf8; --ok:#22c55e; --fail:#ef4444; }
  body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--tx); padding: 20px; max-width: 900px; margin: auto; }
  h1 { color: var(--ac); font-size: 20px; }
  .card { background: var(--panel); border: 1px solid var(--bd); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .status-box { text-align: center; padding: 30px; border-radius: 10px; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
  .allow { background: rgba(34,197,94,0.1); border: 2px solid var(--ok); color: var(--ok); }
  .deny { background: rgba(239,68,68,0.1); border: 2px solid var(--fail); color: var(--fail); }
  .pending { background: rgba(245,158,11,0.1); border: 2px solid #f59e0b; color: #f59e0b; }
  table { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 13px; }
  th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--bd); }
  .pass { color: var(--ok); font-weight: bold; }
  .fail { color: var(--fail); font-weight: bold; }
  .hash { word-break: break-all; color: #86efac; font-size: 12px; }
</style>
</head>
<body>

<h1>🛡️ Sovereign SEOS — Running Book (Live)</h1>
<p style="font-size: 12px; color: #64748b;">This dashboard reads directly from <code>proof/report.json</code>.</p>

<div class="card">
  <div id="verdict-box" class="status-box pending">⏳ Loading Evidence...</div>
  <table>
    <thead>
      <tr><th>Check ID</th><th>Gate Name</th><th>Status</th><th>Evidence Digest</th></tr>
    </thead>
    <tbody id="checks-table">
      <tr><td colspan="4" style="text-align: center;">Loading...</td></tr>
    </tbody>
  </table>
</div>

<div class="card">
  <h3>🔐 Cryptographic Evidence Root</h3>
  <p class="hash" id="evidence-root">Loading...</p>
</div>

<script>
async function loadDashboard() {
  try {
    const response = await fetch('./proof/report.json');
    if (!response.ok) throw new Error('Report not found');
    const data = await response.json();

    const box = document.getElementById('verdict-box');
    if (data.decision === 'ALLOW') {
      box.className = 'status-box allow';
      box.innerHTML = '✅ RELEASE AUTHORIZED (ALLOW)';
    } else {
      box.className = 'status-box deny';
      box.innerHTML = '🚫 RELEASE BLOCKED (DENY)';
    }

    document.getElementById('evidence-root').innerText = data.evidence_root || 'N/A';

    const tbody = document.getElementById('checks-table');
    tbody.innerHTML = '';
    const gateNames = {
      'C1': 'Grammar (EBNF)', 'C2': 'Deduplication', 'C3': 'Epistemic (Wilson)', 
      'C4': 'Independence', 'C5': 'No Hard-Delete', 'C6': 'Determinism', 'C7': 'Ledger Integrity'
    };
    
    data.checks.forEach(c => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${c.check}</td>
        <td>${gateNames[c.check] || 'Unknown'}</td>
        <td class="${c.status === 'PASS' ? 'pass' : 'fail'}">${c.status}</td>
        <td>${c.evidence_digest || '-'}</td>
      `;
      tbody.appendChild(tr);
    });
  } catch (error) {
    document.getElementById('verdict-box').className = 'status-box deny';
    document.getElementById('verdict-box').innerHTML = '❌ ERROR LOADING EVIDENCE';
  }
}
loadDashboard();
</script>
</body>
</html>
