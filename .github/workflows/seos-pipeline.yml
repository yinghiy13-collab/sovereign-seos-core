name: seos-core-pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seos-${{ github.ref }}
  cancel-in-progress: true

env:
  REPORT_DIR: reports
  COMMIT_SHA: ${{ github.sha }}
  OPA_VERSION: "v0.68.0"

jobs:
  l1-ast:
    name: L1 AST scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run AST Scan
        run: |
          mkdir -p $REPORT_DIR
          python tools/ast_check.py --out $REPORT_DIR/l1_ast.json
      - name: Inject Metadata & Binding
        run: |
          python - <<'PY'
          import json
          p = "reports/l1_ast.json"
          data = json.load(open(p))
          data["scan_type"] = "STATIC_AST_POLICY_SCAN"
          data["commit_sha"] = "${{ env.COMMIT_SHA }}"
          json.dump(data, open(p, "w"), indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with: { name: l1, path: reports/l1_ast.json }

  l4-rego:
    name: L4 Rego policy
    runs-on: ubuntu-latest
    needs: l1-ast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: l1, path: reports }
      - name: Install OPA (Pinned)
        run: |
          curl -fsSL -o opa "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x opa && sudo mv opa /usr/local/bin/opa
      - name: Policy Regression Tests
        run: opa test policy/ -v || exit 1
      - name: Evaluate policy
        run: |
          opa eval -f json -d policy -i reports/l1_ast.json "data.seos.allow" > reports/l4_rego.json
          python - <<'PY'
          import json,sys
          r=json.load(open("reports/l4_rego.json"))
          ok=bool(r.get("result")) and r["result"][0]["expressions"][0]["value"] is True
          sys.exit(0 if ok else 1)
          PY
      - uses: actions/upload-artifact@v4
        with: { name: l4, path: reports/l4_rego.json }

  l5-witness:
    name: L5 Ed25519 Witness
    runs-on: ubuntu-latest
    needs: l1-ast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Cryptography
        run: pip install cryptography
      - name: Run Witness
        run: |
          mkdir -p reports
          python tools/witness_ed25519.py --k 2 --n 3 --out reports/l5_witness.json
      - uses: actions/upload-artifact@v4
        with: { name: l5, path: reports/l5_witness.json }

  l6-tamper:
    name: L6 differential tamper
    runs-on: ubuntu-latest
    needs: [l4-rego, l5-witness]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run Tamper Test
        run: |
          mkdir -p reports
          python tools/tamper_test.py --out reports/l6_tamper.json
      - uses: actions/upload-artifact@v4
        with: { name: l6, path: reports/l6_tamper.json }

  l7-release-gate:
    name: L7 release gate (default DENY)
    runs-on: ubuntu-latest
    needs: [l1-ast, l4-rego, l5-witness, l6-tamper]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: reports, merge-multiple: true }
      - name: Decide
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json,os,sys,hashlib,glob
          needs=json.loads(os.environ["RESULTS"])
          layers={k:v["result"] for k,v in needs.items()}
          allow=all(v=="success" for v in layers.values())
          h=hashlib.sha256()
          for p in sorted(glob.glob("reports/*.json")):
              h.update(open(p,"rb").read())
          out={"decision":"ALLOW_CANDIDATE" if allow else "DENY",
               "layers":layers,"evidence_digest":"sha256:"+h.hexdigest(),
               "independent_verification":"NOT_RUN","release_authorization":"DENY"}
          json.dump(out,open("reports/release_decision.json","w"),indent=2)
          sys.exit(0 if allow else 1)
          PY
      - uses: actions/upload-artifact@v4
        with: { name: release-decision, path: reports/release_decision.json }
