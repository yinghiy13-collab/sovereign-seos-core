name: Prove Gate (day-N)
on: { push: { branches: [main] } }
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml scikit-learn numpy scipy
      - name: Run Prove
        run: make prove
      - name: Check Decision
        run: |
          DEC=$(python -c "import json;print(json.load(open('proof/report.json'))['decision'])")
          if [ "$DEC" != "ALLOW" ]; then
            echo "❌ Release Gate returned DENY"
            exit 1
          fi
